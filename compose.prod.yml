# Production deployment.
#
# Every variable below is read from the environment file compose was started
# with, for example
#     docker compose --env-file example.env -f compose.prod.yml up -d
#
# Optional features are switched on by *setting* their variable and stay off
# when it is absent. Compose passes an unresolved variable through as an empty
# string rather than leaving it out, and the application treats empty as unset
# for exactly that reason - so a file that mentions none of the LDAP settings
# yields a site without a login, not a server that refuses to start.
#
# On startup the container runs the migrations and then creates or refreshes the
# restricted database roles, whose passwords are derived from DATABASE_URL - so
# no psql session on the server and no extra variables are needed. See
# packages/api/.env.example for what each variable means.

services:
  app:
    image: ghcr.io/loramint/loramint_docker:latest
    restart: unless-stopped
    environment:
      # --- Core (required) ------------------------------------------------
      # The owner's connection: owns the schema and runs the migrations, and the
      # restricted roles are derived from it. The running application does not
      # query through it - see packages/api/.env.example.
      - DATABASE_URL=postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:?DB_NAME is required}
      - TTN_APP_KEY=${TTN_APP_KEY:?TTN_APP_KEY is required}
      - NODE_ENV=production

      # --- Legal pages (optional) -----------------------------------------
      # Each page only exists while its variable has content.
      - LEGAL_IMPRESSUM=${LEGAL_IMPRESSUM:-}
      - LEGAL_DATENSCHUTZ=${LEGAL_DATENSCHUTZ:-}

      # --- Setup account (optional) ----------------------------------------
      # A local administrator beside the directory, for getting in before there
      # is one - without it there is no login without LDAP, and no way to reach
      # the pages on which LDAP gets configured. Prefer the hash over ADMIN_PW:
      #     docker exec -it loramint-app-1 bun scripts/hash-password.ts
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PW=${ADMIN_PW:-}

      # --- Device management (optional, TTN) -------------------------------
      # Without both of the first two the device page stays an announcement and
      # no request ever leaves this server for The Things Network.
      #
      # TTN_API_KEY is NOT TTN_APP_KEY above, however alike they look: that one
      # is the word the webhook sends us and we compare, this one may register
      # devices in the application and read their root keys. The server refuses
      # to start if they are set to the same value.
      - TTN_API_KEY=${TTN_API_KEY:-}
      - TTN_APPLICATION_ID=${TTN_APPLICATION_ID:-}
      - TTN_URL=${TTN_URL:-}
      - TTN_TIMEOUT_MS=${TTN_TIMEOUT_MS:-}
      # Passed through rather than pinned like TRUSTED_PROXIES: this file does
      # not decide which cluster or region a deployment sits in. Empty means the
      # default in config.ts, which is what the devices registered by hand so
      # far already use.
      - TTN_FREQUENCY_PLAN=${TTN_FREQUENCY_PLAN:-}
      - TTN_LORAWAN_VERSION=${TTN_LORAWAN_VERSION:-}
      - TTN_REGIONAL_PARAMETERS=${TTN_REGIONAL_PARAMETERS:-}

      # --- Login (optional, LDAP) -----------------------------------------
      # Without LDAP_URL there is no login, no roles and no management section;
      # with it, SESSION_SECRET and one of the two bind strategies are required
      # and the server refuses to start if they are missing.
      - LDAP_URL=${LDAP_URL:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-}
      # Strategy 1 - direct bind.
      - LDAP_USER_DN_TEMPLATE=${LDAP_USER_DN_TEMPLATE:-}
      # Strategy 2 - a service account looks the user up first.
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:-}
      - LDAP_SEARCH_FILTER=${LDAP_SEARCH_FILTER:-}
      # Group membership: an attribute on the user entry, or a search over the
      # group entries for directories without the memberof overlay.
      - LDAP_GROUP_ATTRIBUTE=${LDAP_GROUP_ATTRIBUTE:-}
      - LDAP_GROUP_SEARCH_BASE=${LDAP_GROUP_SEARCH_BASE:-}
      - LDAP_GROUP_FILTER=${LDAP_GROUP_FILTER:-}
      - LDAP_GROUP_NAME_ATTRIBUTE=${LDAP_GROUP_NAME_ATTRIBUTE:-}
      - LDAP_DISPLAY_NAME_ATTRIBUTE=${LDAP_DISPLAY_NAME_ATTRIBUTE:-}
      - LDAP_PASSWORD_RESET_URL=${LDAP_PASSWORD_RESET_URL:-}
      - LDAP_TIMEOUT_MS=${LDAP_TIMEOUT_MS:-}
      # The four groups that grant privileges. An unset data group means every
      # signed-in user may read; unset management, admin and board groups mean
      # nobody reaches those areas, so editing rights and the board curation
      # page are never granted by accident.
      - LDAP_DATA_GROUP=${LDAP_DATA_GROUP:-}
      - LDAP_MANAGEMENT_GROUP=${LDAP_MANAGEMENT_GROUP:-}
      - LDAP_ADMIN_GROUP=${LDAP_ADMIN_GROUP:-}
      - LDAP_BOARD_GROUP=${LDAP_BOARD_GROUP:-}

      # --- Tuning (optional) -----------------------------------------------
      # The restricted database roles are no longer configured here: they are
      # derived from DATABASE_URL and created by the entrypoint. See
      # packages/api/.env.example for which role does what and why the
      # application no longer queries as the schema owner.
      - QUERY_MAX_ROWS=${QUERY_MAX_ROWS:-}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-}
      - MANAGE_MAX_DELETE=${MANAGE_MAX_DELETE:-}
      - MANAGE_TIMEOUT_MS=${MANAGE_TIMEOUT_MS:-}
    depends_on:
      - db
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loramint.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      - "traefik.http.routers.loramint.entrypoints=websecure"
      - "traefik.http.routers.loramint.tls=true"
      - "traefik.http.routers.loramint.tls.certResolver=http_resolver"
      - "traefik.http.services.loramint.loadbalancer.server.port=8090"
      - "traefik.docker.network=traefik"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:?DB_NAME is required}
      - POSTGRES_USER=${DB_USER:?DB_USER is required}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
  traefik:
    external: true

volumes:
  db_data:
